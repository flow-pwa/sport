<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A0A0E">
<title>Sport · prova suono</title>
<style>
  body { margin: 0; background: #0A0A0E; color: #F5F5F7; font: 17px/1.4 -apple-system, system-ui, sans-serif; padding: 24px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p, li { color: #8E8E99; }
  ol { padding-left: 20px; margin: 0 0 18px; }
  button { display: flex; align-items: center; gap: 14px; width: 100%; margin: 0 0 12px; padding: 16px; border: 0; border-radius: 16px;
           background: #17171D; color: #F5F5F7; font: inherit; text-align: left; }
  button b { font-size: 28px; width: 40px; height: 40px; border-radius: 12px; background: #BF5AF2; color: #0A0A0E; display: grid; place-items: center; flex: none; }
  button small { display: block; color: #8E8E99; }
  button.on { outline: 2px solid #BF5AF2; }
  #log { color: #8E8E99; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>
<h1>Prova suono</h1>
<ol>
  <li>Metti il <b>silenzioso</b> e fai partire <b>Spotify</b>.</li>
  <li>Tocca A. Ascolta: senti i bip? La musica continua?</li>
  <li>Se la musica si è fermata, rimettila. Poi B, C, D.</li>
</ol>
<button data-m="A"><b>A</b><span>Ambiente<small>Web Audio, modo «ambient»</small></span></button>
<button data-m="B"><b>B</b><span>Breve<small>Web Audio, modo «transient»</small></span></button>
<button data-m="C"><b>C</b><span>Riproduzione + traccia muta<small>Web Audio, «playback» + audio silenzioso in loop</small></span></button>
<button data-m="D"><b>D</b><span>Elemento audio<small>&lt;audio&gt;, modo automatico</small></span></button>
<p id="log"></p>
<script>
(() => {
  const log = (t) => { document.getElementById('log').textContent = t; };
  // suono in formato wav (per la prova D e la traccia muta della C)
  function wav(f, d, vol) {
    const rate = 44100, n = Math.floor(rate * d), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      const t = i / rate, env = Math.min(1, t / 0.01) * Math.min(1, (d - t) / 0.06);
      v.setInt16(44 + i * 2, vol * env * (0.6 * Math.sin(2 * Math.PI * f * t) + 0.4 * Math.sin(4 * Math.PI * f * t)) * 32767, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }
  let ctx = null, mute = null, el = null;
  function setType(t) { try { if (navigator.audioSession) navigator.audioSession.type = t; } catch (e) {} }
  function webBeeps() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state !== 'running') ctx.resume();
    [0, 0.45, 0.9].forEach((dt) => {
      const t = ctx.currentTime + 0.05 + dt, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.3);
    });
  }
  function reset() {
    if (mute) { mute.pause(); mute = null; }
    if (ctx) { ctx.close().catch(() => {}); ctx = null; }
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    const m = b.dataset.m;
    reset();
    if (m === 'A') { setType('ambient'); webBeeps(); }
    if (m === 'B') { setType('transient'); webBeeps(); }
    if (m === 'C') {
      setType('playback');
      mute = new Audio(wav(440, 1, 0)); mute.loop = true; mute.setAttribute('playsinline', '');
      mute.play().catch(() => {});
      webBeeps();
    }
    if (m === 'D') {
      setType('auto');
      if (!el) el = new Audio(wav(880, 0.25, 0.8));
      let k = 0; const go = () => { el.currentTime = 0; el.play().catch(() => {}); if (++k < 3) setTimeout(go, 450); }; go();
    }
    log('Prova ' + m + ' · audioSession: ' + (navigator.audioSession ? navigator.audioSession.type : 'non c\'è'));
  });
})();
</script>
</body>
</html>
