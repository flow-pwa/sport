<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0A0A0E">
<title>Flow · ripristino</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0A0A0E; color: #F5F5F7;
         font: 18px/1.4 -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  b { font-size: 22px; }
  p { color: #8E8E99; }
</style>
</head>
<body>
<div><b id="t">Pulisco la versione vecchia…</b><p id="d"></p></div>
<script>
// Toglie la copia vecchia dell'app salvata nel telefono e riapre quella nuova
(async () => {
  const t = document.getElementById('t'), d = document.getElementById('d');
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
    t.textContent = 'Fatto ✓';
    d.textContent = 'Riapro l\'app aggiornata…';
    setTimeout(() => location.replace('./?r=' + Date.now()), 1200);
  } catch (e) {
    t.textContent = 'Non ci sono riuscito';
    d.textContent = e.name + ': ' + e.message;
  }
})();
</script>
</body>
</html>
